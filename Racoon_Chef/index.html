<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Raccoon Chef · Trash Panda Special</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="trash-card">
        <div class="header">
            <h1>
                <span>🦝🗑️</span> RACCOON CHEF
            </h1>
        </div>
        <div class="sub">dumpster diving · classic scraps + internet trash</div>

        <!-- ingredients -->
        <div class="fridge-panel">
            <div class="panel-title">🥫 MY TRASH FRIDGE</div>
            <div class="tags" id="ingredientsList"></div>
            <div class="add-ingredient">
                <input type="text" id="newIngredient" placeholder="e.g. potato, sausage, cabbage...">
                <button id="addBtn">➕ ADD SCRAP</button>
            </div>
            <div style="font-size:0.65rem; margin-top:8px;">🦝 tip: use english names (potato, fish, onion)</div>
        </div>

        <!-- two buttons: offline classic / online search -->
        <div class="button-group">
            <button class="trash-btn offline" id="localBtn">🦝 CALL RACCOON (OFFLINE)</button>
            <button class="trash-btn online" id="onlineBtn">🌐 RACCOON GOES ONLINE</button>
        </div>

        <!-- result panel -->
        <div class="result-area" id="resultBox">
            <div class="empty-message">🗑️ click a button — raccoon will steal a recipe for you</div>
        </div>
        <div class="footnote">🦝 offline mode = classic pairings &nbsp;|&nbsp; 🌐 online = TheMealDB (needs live server)</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
